[package]
name = "penta-host"
version = "0.1.0"
edition = "2024"
description = "One in-memory native Penta match with organizer and seat capabilities"
publish = false

[dependencies]
penta = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
