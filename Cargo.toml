[workspace]
members = [".", "wasm", "bindings/penta-ffi"]
# penta-py links against a Python toolchain, so it builds on its own rather
# than dragging that requirement into every `cargo test`.
exclude = ["bindings/penta-py"]
resolver = "3"

# Tests run optimized: the engine's slow tier plays whole games, and an
# unoptimized build makes that roughly twenty times slower for no added
# coverage. Debug assertions and overflow checks stay on, so the invariant
# checks scattered through the rules engine still fire.
[profile.quick-test]
inherits = "release"
debug-assertions = true
overflow-checks = true

[package]
name = "penta"
version = "0.6.0"
edition = "2024"
description = "A deterministic engine for two-player constructed Magic"
license = "Apache-2.0"
repository = "https://github.com/lacker/penta"

[lib]
path = "src/lib.rs"

[dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
